{id:"m0a",m:"Módulo 0.0",t:"Software, sistema, app, site e página",min:15,b:`<p>São palavras que parecem iguais e não são. Uma analogia ajuda: <b>software</b> é a receita, <b>hardware</b> é a cozinha, e <b>sistema</b> é o restaurante inteiro funcionando.</p><ul><li><b>Software:</b> qualquer conjunto de instruções que o computador executa. É o termo mais amplo.</li><li><b>Aplicativo (app):</b> software que a pessoa usa direto, como o WhatsApp.</li><li><b>Sistema:</b> várias partes trabalhando juntas por um objetivo. Sua secretária é um sistema: robô do WhatsApp, painel, planilha e IA.</li><li><b>Página web:</b> um documento que o navegador abre. <b>Site:</b> conjunto de páginas sob um endereço. <b>Aplicação web:</b> site com funções, como o zava-tours.</li></ul><p>Teste seu entendimento: o zava-visit é um site, um app ou um sistema? Escreva sua resposta antes de ler o dicionário.</p>`},
{id:"m0b",m:"Módulo 0.0",t:"Cliente e servidor: a conversa da internet",min:20,b:`<p>A internet é uma rede de computadores. Nela, quem <b>pede</b> é o <b>cliente</b> (seu navegador, seu celular) e quem <b>responde</b> é o <b>servidor</b>.</p><p>Um servidor não tem nada de mágico: é um computador de alguém, ligado o tempo todo, rodando um programa que fica esperando pedidos. A Render e a Cloudflare alugam computadores assim.</p><h3>Lendo um endereço (URL)</h3><pre><code>https://meusite.onrender.com/api/status

https      = o idioma seguro da conversa
meusite.onrender.com = o nome do computador (domínio)
/api/status = o que você está pedindo a ele</code></pre><h3>Pedido, resposta e número de status</h3><p>Seu navegador faz uma <b>requisição</b> (pedido). O servidor devolve uma <b>resposta</b> com um número: <code>200</code> deu certo, <code>403</code> proibido, <code>404</code> não achei, <code>500</code> o servidor falhou.</p><p><b>Atenção:</b> no seu sistema, <code>/api/status</code> é só o nome de uma rota que devolve o relatório do sistema sobre si mesmo. Não confunda com o número de status.</p>`},
{id:"m0c",m:"Módulo 0.0",t:"O que é uma API: de onde vem, como se cria e quando usar",min:45,b:`<p><b>Comece pelo problema.</b> Programas são feitos por pessoas e empresas diferentes, em linguagens diferentes, rodando em computadores diferentes. Seu robô do WhatsApp precisa que o Gemini (do Google) entenda uma mensagem. Ele não pode abrir o código do Google e usá-lo por dentro. A solução é o dono do sistema publicar um <b>contrato</b>: “estes são os pedidos que aceito, nesta forma, e estas são as respostas que devolvo”. Esse contrato é a API.</p><h3>O que a sigla significa</h3><p><b>API</b> = <i>Application Programming Interface</i>, em português “interface de programação de aplicações”. <b>Interface</b> é um ponto de contato. <b>De programação</b> quer dizer que quem usa é outro programa, não uma pessoa. Analogia: a tomada da parede. O formato dela é um padrão, então você liga qualquer aparelho sem saber como a usina funciona. Outra analogia: o cardápio de um restaurante lista o que você pode pedir sem deixar você entrar na cozinha.</p><h3>Uma API é código?</h3><p>São duas coisas ligadas:</p><ul><li><b>O contrato:</b> um texto (a documentação) que diz quais pedidos existem, o que enviar e o que volta. É isso que você, como cliente, lê e usa.</li><li><b>O código que cumpre o contrato:</b> escrito por quem criou o sistema e rodando no servidor dele. Você não vê esse código e não precisa vê-lo.</li></ul><h3>De onde vem e quem cria</h3><p>Sempre alguém a escreve. Existem quatro origens, e seu projeto usa todas:</p><ul><li><b>API de terceiros:</b> criada por uma empresa para você usar, como a do Gemini. Você pede, ela responde, geralmente com uma chave e dentro de limites de uso e de preço. O pacote <code>@google/genai</code>, no seu package.json, é um <b>SDK</b>: código pronto que embrulha a API do Gemini para você não montar os pedidos à mão.</li><li><b>API própria:</b> a que você (com a IA) criou no <code>index.js</code>, usando a biblioteca Express. Veja o exemplo abaixo.</li><li><b>API do navegador:</b> funções que o próprio Safari ou Chrome oferecem à sua página, como guardar dados no aparelho (localStorage) ou buscar dados (fetch).</li><li><b>API de uma biblioteca:</b> o conjunto de funções que uma biblioteca expõe. Ao usar o Three.js nos tours 3D, você usa a API dele.</li></ul><p>Como a sua API própria é criada, em um trecho simplificado no estilo do seu projeto:</p><pre><code>app.get("/api/status", async (req, res) => {
  // app.get: quando alguém PEDIR (GET) este caminho...
  // /api/status: o caminho, um item do cardápio
  // req: o pedido que chegou. res: a resposta que voltará
  res.json({ inventoryCount: 12 });
  // ...devolva estes dados em formato JSON
});</code></pre><p>Cada <code>app.get</code>, <code>app.post</code>, <code>app.put</code> e <code>app.delete</code> do seu index.js é um item do cardápio. Quem o escreve decide o que ele faz e também <b>quem pode usá-lo</b>. Foi aqui que faltou o login.</p><p><b>Um cuidado para o futuro:</b> o Baileys, que seu robô usa para o WhatsApp, é uma biblioteca não oficial que simula o WhatsApp Web, e não a API oficial do WhatsApp. Confirme as regras do WhatsApp para uso comercial antes de vender o produto, porque há risco de bloqueio do número.</p><h3>Rotas, verbos e JSON</h3><ul><li><b>Rota (endpoint):</b> cada item do cardápio, como <code>/api/property</code>.</li><li><b>Verbos:</b> GET pega dados, POST cria, PUT altera, DELETE apaga.</li><li><b>JSON:</b> o formato dos dados trocados, texto organizado em nome e valor: <code>{"quartos": 3}</code>.</li></ul><p><b>Por que isso importa no seu projeto:</b> as rotas da secretária não pedem login. É como um restaurante em que qualquer pessoa na rua pode gritar “apague todos os imóveis” e a cozinha obedece, sem perguntar quem é. Essa é a falha que tratamos no Passo 0.</p><h3>Como você usa uma API (do lado do cliente)</h3><p>No JavaScript, o comando é <code>fetch</code>: ele faz a requisição e espera a resposta.</p><pre><code>const resp = await fetch("https://meusite.onrender.com/api/status");
// pede ao endereço (GET é o padrão)
const dados = await resp.json();
// transforma o texto JSON em dados que o JavaScript entende
console.log(dados.inventoryCount);
// mostra um valor da resposta</code></pre><p>APIs de terceiros costumam exigir uma <b>chave</b> enviada junto com o pedido, para saber quem pede e poder cobrar ou limitar.</p><h3>Quando usar uma API</h3><ul><li>Quando você precisa de algo que outro sistema faz melhor do que você: IA, mapas, pagamentos, envio de mensagens.</li><li>Quando a página precisa guardar ou buscar dados num servidor. No zava-tours, <code>functions/api/salvar/[id].js</code> e <code>carregar/[id].js</code> formam uma pequena API que guarda e devolve cada tour.</li><li>Quando você quer que outros sistemas usem o seu, por exemplo ao vender a secretária para empresas.</li></ul><p><b>Quando não usar:</b> numa página que só mostra conteúdo fixo, como o zava-visit hoje. Sem servidor, não há API.</p><h3>Por que uma API é diferente da outra</h3><p>Cada API é um contrato próprio. O que muda de uma para outra:</p><ul><li><b>Endereço e rotas:</b> onde pedir e o quê.</li><li><b>Formato dos dados:</b> quais campos enviar e quais voltam.</li><li><b>Autenticação:</b> chave, login ou nenhuma (a sua, hoje).</li><li><b>Limites e preço:</b> quantos pedidos por minuto e quanto custa.</li><li><b>Versão:</b> contratos mudam, e versões antigas podem parar de funcionar.</li></ul><p><b>Estilos que você vai encontrar:</b> <b>REST</b> é o mais comum, com rotas, verbos e JSON, e é o estilo da sua API. <b>GraphQL</b> tem um único endereço e você descreve os dados que quer. <b>Webhook</b> é o contrário: o outro sistema chama você quando algo acontece (seu .env tem uma URL de webhook para a planilha). <b>WebSocket</b> é uma conversa contínua, sem repetir pedidos, como a que o robô mantém com o WhatsApp.</p><h3>Como aprender uma API nova</h3><p>Procure a <b>documentação</b> oficial (busque “nome da API docs”). Leia nesta ordem: <i>Quickstart</i> (primeiro exemplo), <i>Authentication</i> (como se identificar), <i>Reference</i> (todas as rotas) e <i>Rate limits</i> (limites de uso).</p><h3>Exercício</h3><ol><li>Em Termos, releia “API”, “Rota” e “JSON”.</li><li>Abra o index.js da secretária e liste cada <code>app.get</code>, <code>app.post</code>, <code>app.put</code> e <code>app.delete</code>. Monte uma tabela: verbo, caminho, o que faz e se pede login.</li><li>Explique, com suas palavras, a diferença entre a API do Gemini e a API do seu index.js. Envie pelo chat.</li></ol>`},
{id:"m0d",m:"Módulo 0.0",t:"Onde o código mora: arquivos, Git e hospedagem",min:25,b:`<p><b>Código</b> é texto com instruções numa linguagem de programação. Um <b>projeto</b> é uma pasta cheia de arquivos de código.</p><h3>As três camadas de um site</h3><ul><li><b>HTML:</b> a estrutura (títulos, botões).</li><li><b>CSS:</b> a aparência (cores, tamanhos).</li><li><b>JavaScript:</b> o comportamento (o que acontece ao clicar).</li></ul><p>Tudo isso é o <b>front-end</b>: roda no navegador. O <b>back-end</b> roda no servidor, fora da vista, como o <code>index.js</code> da secretária. Os dados ficam num <b>banco de dados</b>; sua planilha do Google cumpre esse papel.</p><h3>Guardando versões</h3><p><b>Git</b> é a máquina do tempo do código. Cada <b>commit</b> é uma foto salva com uma mensagem. O <b>repositório</b> é a pasta com todo o histórico. O <b>GitHub</b> guarda repositórios na nuvem.</p><h3>Colocando no ar</h3><p><b>Hospedagem</b> é alugar um computador para deixar o projeto ligado (Render, Cloudflare, GitHub Pages). <b>Deploy</b> é publicar a versão nova lá.</p>`},
{id:"m0e",m:"Módulo 0.0",t:"Segredos e segurança em palavras simples",min:15,b:`<p>Uma <b>chave de API</b> é a senha que autoriza seu sistema a usar um serviço, como o Gemini. Quem a possui gasta o seu limite. Por isso ela vive num arquivo <code>.env</code> (ou nas variáveis de ambiente da Render), nunca no GitHub.</p><ul><li><b>Autenticação:</b> provar quem você é.</li><li><b>Autorização:</b> o que você pode fazer depois de provar.</li><li><b>Vulnerabilidade:</b> falha que deixa alguém fazer o que não deveria.</li><li><b>Auditoria:</b> examinar o sistema para achar essas falhas.</li></ul><p>Seu objetivo final é ser capaz de auditar. Tudo o que você aprende aqui leva a isso.</p>`},
{id:"p0",m:"Passo 0",t:"Conter o risco dos seus projetos",min:20,b:`<p>Leia antes o <b>Módulo 0.0</b>. Os termos desta lição estão explicados lá e em <b>Termos</b>.</p><p>Seus projetos já têm dados de clientes reais. Antes de estudar, vamos <b>reduzir a exposição</b>. Cada etapa tem um porquê, e entender o porquê é o que te transforma em auditor.</p>
<h3>O que descobrimos</h3><ul><li>O servidor da secretária não pede login em nenhuma rota.</li><li>O arquivo <code>.env</code> (o cofre de chaves) foi parar no GitHub.</li><li>Seu número pessoal aparece em arquivos públicos.</li></ul>
<h3>Ideia central</h3><p>Um sistema é seguro quando só entra quem provou quem é (<b>autenticação</b>) e só faz o que lhe é permitido (<b>autorização</b>). Hoje, nas rotas da API, qualquer pessoa entra e faz tudo.</p>
<p>As etapas práticas estão em <b>Tarefas</b>. Faça uma por vez e anote o que viu.</p>`},
{id:"s1a",m:"Semana 1",t:"O computador por dentro",min:25,b:`<p>Todo programa que você já pediu à IA acaba em quatro peças: <b>arquivos</b> (guardados no disco), <b>processos</b> (programas rodando), <b>memória</b> (onde o processo guarda o que está usando) e <b>rede</b> (como falam com outros computadores).</p>
<h3>Um servidor é só um computador</h3><p>A Render, a Cloudflare e o GitHub Pages são computadores de outras pessoas, ligados 24h, que guardam seus arquivos e rodam seu código. Quando alguém abre o link do seu tour, o navegador pede os arquivos a esse computador.</p>
<h3>O caminho de uma requisição</h3><ol><li>Você digita o endereço.</li><li>O navegador descobre o computador dono dele (DNS).</li><li>Envia um pedido (HTTP).</li><li>O servidor responde com arquivos ou dados.</li><li>O navegador desenha a página.</li></ol>
<p><b>Por que importa:</b> cada falha de segurança vive em algum ponto desse caminho. Saber o caminho é saber onde olhar.</p>`},
{id:"s1b",m:"Semana 1",t:"Terminal: seus primeiros comandos",min:30,b:`<p>O terminal é uma conversa por texto com o computador. Tudo que você faz clicando também pode ser feito por comando, e a IA usa comandos o tempo todo.</p>
<pre><code>pwd          # mostra em qual pasta você está
ls           # lista o que há na pasta
cd nome      # entra numa pasta
cd ..        # volta uma pasta
mkdir teste  # cria uma pasta
node -v      # mostra a versão do Node.js</code></pre>
<p>No Mac, abra o app <b>Terminal</b> (Cmd+Espaço e digite Terminal). Regra de ouro: <b>leia o comando antes de dar Enter</b>. Se não entende o que ele faz, pergunte no chat.</p>`},
{id:"s2a",m:"Semana 2",t:"JavaScript: variáveis e tipos",min:30,b:`<p>Uma <b>variável</b> é uma caixa com nome que guarda um valor. Em JavaScript:</p>
<pre><code>const marca = "Zava";     // texto (string), não muda
let lotes = 12;           // número, pode mudar
lotes = lotes + 1;        // agora vale 13
const ativo = true;       // verdadeiro ou falso (boolean)</code></pre>
<p><b>Exercício de prever:</b> antes de rodar, escreva o que <code>console.log(marca, lotes)</code> mostra depois dessas linhas. Depois confira no console do navegador (Cmd+Option+J).</p>`},
{id:"s2b",m:"Semana 2",t:"JavaScript: funções",min:30,b:`<p>Uma <b>função</b> é uma receita com nome: recebe ingredientes (parâmetros) e devolve um resultado.</p>
<pre><code>function precoTotal(valor, desconto) {
  return valor - valor * desconto;
}
precoTotal(500000, 0.1);   // devolve 450000</code></pre>
<p>Quando você lê o <code>index.js</code> da secretária, quase tudo são funções. Ler código é achar a função, ver o que entra e o que sai.</p>`}];

{id:"t1",t:"Passo 0 - Etapa 1: ver o sistema de fora",d:"Antes, leia as lições do Módulo 0.0. Depois, abra uma janela anônima do navegador (Cmd+Shift+N). Digite o endereço do seu sistema na Render, que termina em onrender.com, e acrescente /api/status no fim. Isso faz você pedir ao sistema, como um estranho, o relatório dele sobre si mesmo. Se aparecer um bloco de texto cheio de dados, a falha existe. Anote o que viu, sem colar telefones."},
{id:"t2",t:"Passo 0 - Etapa 2: repositório privado",d:"Repositório é a pasta do projeto guardada no GitHub. Lá: Settings, Danger Zone, Change visibility, Make private, no secretaria-imoveis-whatsapp. Depois confira se a Render ainda faz deploy."},
{id:"t3",t:"Passo 0 - Etapa 3: tirar o .env do GitHub",d:"O .env é o arquivo de segredos do sistema (chaves e senhas). Apague-o pela página do GitHub e adicione a linha .env ao arquivo .gitignore. O .env.example continua."},
{id:"t4",t:"Passo 0 - Etapa 4: revisar a chave do Gemini",d:"Chave de API é a senha que autoriza seu sistema a usar o Gemini (a IA do Google). No Google AI Studio, veja as chaves. Se alguma já esteve em lugar público, crie outra, apague a antiga e ponha a nova em Environment na Render."},
{id:"t5",t:"Passo 0 - Etapa 5: mapa do ecossistema",d:"Tabela com os 7 projetos: o que faz, link no ar, onde está hospedado (github.io, onrender.com, pages.dev) e se é versão de outro."},
{id:"t6",t:"Semana 1: navegar pelo terminal",d:"Abra o Terminal, use pwd, ls e cd até chegar na pasta de um projeto seu. Rode node -v. Anote o que cada comando mostrou."},

G.sort((a,b)=>a[0].localeCompare(b[0],"pt"));
const NAV=[["home","🏠","Início"],["apo","📖","Apostila"],["gls","📚","Termos"],["tar","✅","Tarefas"],["pro","📝","Provas"],["tri","🧭","Trilha"],["mais","⚙️","Mais"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST=["A fazer","Feita","Revisada no chat"];
const tdone=id=>(S.tasks[id]||{s:0}).s>0;
function pct(){const n=L.filter(l=>S.done[l.id]).length+T.filter(t=>tdone(t.id)).length+P.filter(p=>S.done[p.id]).length;return Math.round(100*n/(L.length+T.length+P.length))}
function applyTheme(){if(S.theme)document.documentElement.setAttribute("data-theme",S.theme);else document.documentElement.removeAttribute("data-theme")}
function nav(){document.getElementById("nav").innerHTML=NAV.map(n=>`<button data-a="nav" data-i="${n[0]}" class="${V===n[0]?"on":""}" aria-label="${n[2]}"><span>${n[1]}</span>${n[2]}</button>`).join("")}
function home(){const nt=T.find(t=>!tdone(t.id)),nl=L.find(l=>!S.done[l.id]);const p=pct();
return `<h1>Escola Dev</h1><p class="mu">Sua formação para comandar seus projetos com a IA como assistente.</p>
<div class="card"><div class="row sp"><b>Progresso geral</b><span class="pill">${p}%</span></div><div class="bar" style="margin-top:10px"><i style="width:${p}%"></i></div></div>
${nt?`<div class="card"><span class="pill w">Próxima tarefa</span><h3>${esc(nt.t)}</h3><p class="mu">${esc(nt.d)}</p><button class="btn s" data-a="nav" data-i="tar">Ver tarefas</button></div>`:""}
${nl?`<div class="card"><span class="pill">Próxima leitura</span><h3>${esc(nl.t)}</h3><p class="mu">${esc(nl.m)}, cerca de ${nl.min} min.</p><button class="btn s" data-a="open" data-i="${nl.id}">Abrir lição</button></div>`:""}
<div class="card"><b>Como usar</b><p class="mu">Comece pelo Módulo 0.0 da Apostila e consulte Termos sempre que um nome novo aparecer. Aqui você lê, faz tarefas e treina nas provas. No chat com o Claude você tira dúvidas e manda o que fez para ser revisado. Quando uma tarefa for revisada, mude o status dela para “Revisada no chat”.</p></div>`}
function apo(){if(OP){const l=L.find(x=>x.id===OP);return `<button class="btn g s" data-a="close">Voltar</button><h1 style="margin-top:14px">${l.t}</h1><p class="mu">${l.m}, cerca de ${l.min} min</p><div class="read">${l.b}</div><button class="btn" data-a="done" data-i="${l.id}">${S.done[l.id]?"Lição concluída (desfazer)":"Marcar como concluída"}</button>`}
return `<h1>Apostila</h1><p class="mu">Leia, teste no seu computador e anote o que não entendeu.</p>`+L.map(l=>`<button class="card item" data-a="open" data-i="${l.id}"><div class="row sp"><b>${l.t}</b><span class="pill ${S.done[l.id]?"o":""}">${S.done[l.id]?"Concluída":l.m}</span></div><div class="mu">${l.min} min de leitura</div></button>`).join("")}
function tar(){return `<h1>Tarefas</h1><p class="mu">Toque no botão para avançar o status. Suas anotações ficam salvas.</p>`+T.map(t=>{const s=S.tasks[t.id]||{s:0,n:""};return `<div class="card"><div class="row" style="flex-wrap:nowrap"><div class="chk">${s.s>0?"✓":""}</div><b>${t.t}</b></div><p class="mu">${t.d}</p><div class="row"><button class="btn s ${s.s?"":"g"}" data-a="task" data-i="${t.id}">${ST[s.s]}</button></div><textarea data-n="${t.id}" placeholder="O que você viu, sentiu ou não entendeu?">${esc(s.n||"")}</textarea></div>`}).join("")}
function pro(){if(!QS)return `<h1>Provas</h1><p class="mu">Seis perguntas sobre o que você estudou. Errar aqui é parte do treino.</p><div class="card"><p>Melhor resultado: <b>${S.best}/${Q.length}</b></p><button class="btn" data-a="qstart">Começar prova</button></div><p class="mu">Provas abertas, como explicar com suas palavras, você envia pelo chat.</p>`;
if(QS.i>=Q.length){return `<h1>Resultado</h1><div class="card"><p style="font-size:28px;margin:0"><b>${QS.sc}/${Q.length}</b></p><p class="mu">${QS.sc===Q.length?"Perfeito. Pode avançar.":"Releia as lições dos erros e tente de novo."}</p><button class="btn" data-a="qstart">Refazer</button></div>`}
const q=Q[QS.i];return `<h1>Pergunta ${QS.i+1} de ${Q.length}</h1><p><b>${q.q}</b></p>`+q.o.map((o,k)=>`<button class="opt ${QS.r!==null?(k===q.a?"ok":(k===QS.r?"no":"")):""}" data-a="qans" data-i="${k}" ${QS.r!==null?"disabled":""}>${o}</button>`).join("")+(QS.r!==null?`<div class="card"><b>${QS.r===q.a?"Certo.":"Quase."}</b> ${q.e}</div><button class="btn" data-a="qnext">${QS.i+1<Q.length?"Próxima":"Ver resultado"}</button>`:"")}
function tri(){return `<h1>Trilha</h1><p class="mu">Seis fases. Marque cada uma quando atingir o marco, de verdade.</p><ul class="trail">`+P.map(p=>`<li class="${S.done[p.id]?"on":""}"><b>${p.t}</b><div class="mu">${p.m}</div><button class="btn s g" style="margin-top:6px" data-a="ph" data-i="${p.id}">${S.done[p.id]?"Atingido (desfazer)":"Marcar como atingido"}</button></li>`).join("")+`</ul>`}
function mais(){return `<h1>Mais</h1><div class="card"><b>Aparência</b><div class="row" style="margin-top:8px"><button class="btn s g" data-a="theme" data-i="">Automático</button><button class="btn s g" data-a="theme" data-i="light">Claro</button><button class="btn s g" data-a="theme" data-i="dark">Escuro</button></div></div>
<div class="card"><b>Salvar e levar seu progresso</b><p class="mu">Seu progresso fica neste aparelho. Para levar para outro, copie o texto abaixo e cole no outro aparelho, na mesma caixa, depois toque em Importar.</p><textarea id="io">${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:8px"><button class="btn s" data-a="copy">Copiar</button><button class="btn s g" data-a="imp">Importar</button></div><p class="mu" id="msg">${MSG}</p></div>
<div class="card"><b>Apagar tudo</b><p class="mu">Remove progresso e anotações deste aparelho.</p><button class="btn s g" data-a="reset">Apagar progresso</button></div>`}
function glist(){const q=GQ.trim().toLowerCase();const r=G.filter(g=>!q||g[0].toLowerCase().includes(q)||g[1].toLowerCase().includes(q));return r.length?r.map(g=>`<div class="card"><b>${g[0]}</b><p class="mu" style="margin:4px 0 0;font-size:15px">${g[1]}</p></div>`).join(""):'<p class="mu">Nenhum termo encontrado.</p>'}
function gls(){return `<h1>Termos</h1><p class="mu">Dicionário fixo. Digite qualquer palavra que você não conheça.</p><input id="gq" type="search" placeholder="Buscar termo" value="${esc(GQ)}" style="width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx)"><div id="gl">${glist()}</div>`}
function render(){nav();const f={home,apo,gls,tar,pro,tri,mais}[V];document.getElementById("app").innerHTML=f();}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a==="nav"){V=i;OP=null;QS=null;MSG="";window.scrollTo(0,0)}
else if(a==="open"){V="apo";OP=i;window.scrollTo(0,0)}
else if(a==="close")OP=null;
else if(a==="done"||a==="ph"){S.done[i]=!S.done[i];save()}
else if(a==="task"){const t=S.tasks[i]||{s:0,n:""};t.s=(t.s+1)%3;S.tasks[i]=t;save()}
else if(a==="qstart")QS={i:0,sc:0,r:null};
else if(a==="qans"){const k=+i;QS.r=k;if(k===Q[QS.i].a)QS.sc++}
else if(a==="qnext"){QS.i++;QS.r=null;if(QS.i>=Q.length&&QS.sc>S.best){S.best=QS.sc;save()}}
else if(a==="theme"){S.theme=i;save();applyTheme()}
else if(a==="copy"){const ta=document.getElementById("io");ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(x){}MSG=ok?"Copiado.":"Selecione o texto e copie manualmente.";document.getElementById("msg").textContent=MSG;return}
else if(a==="imp"){try{const d=JSON.parse(document.getElementById("io").value);if(typeof d!=="object"||!d.done||!d.tasks)throw 0;S=Object.assign({done:{},tasks:{},best:0,theme:""},d);save();applyTheme();MSG="Progresso importado."}catch(x){MSG="Texto inválido. Cole exatamente o que foi copiado."}}
else if(a==="reset"){if(confirm("Apagar todo o progresso deste aparelho?")){S={done:{},tasks:{},best:0,theme:""};save();applyTheme()}}
render()});
document.addEventListener("input",e=>{if(e.target.id==="gq"){GQ=e.target.value;document.getElementById("gl").innerHTML=glist();return}const id=e.target.dataset&&e.target.dataset.n;if(!id)return;const t=S.tasks[id]||{s:0,n:""};t.n=e.target.value;S.tasks[id]=t;save()});
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const tk=()=>key(new Date());
const D=()=>S.days||(S.days={});
const mins=k=>Math.round((D()[k]||0)/60);
function streak(){let n=0;const d=new Date();for(let i=0;i<400;i++){const k=key(d);if((D()[k]||0)>=600)n++;else if(n>0||k!==tk())break;d.setDate(d.getDate()-1)}return n}
function week(){let t=0;const d=new Date();for(let i=0;i<7;i++){t+=D()[key(d)]||0;d.setDate(d.getDate()-1)}return Math.round(t/60)}
function meta(){const m=mins(tk()),g=S.goal||60;return `<div class='row sp'><b>Hoje: ${m} de ${g} min</b><span class='pill ${m>=g?'o':''}'>${streak()} dias seguidos</span></div><div class='bar' style='margin-top:10px'><i style='width:${Math.min(100,100*m/g)}%'></i></div><p class='mu' style='margin:8px 0'>Esta semana: ${week()} min. Conta o tempo com esta página aberta e visível. Dia com 10 min ou mais mantém a sequência.</p><div class='row'><span class='mu'>Meta diária:</span>${[30,60,120].map(x=>`<button class='btn s ${g===x?'':'g'}' data-a='goal' data-i='${x}'>${x} min</button>`).join('')}</div>`}
setInterval(()=>{if(document.hidden)return;const k=tk();D()[k]=(D()[k]||0)+15;save();const e=document.getElementById('meta');if(e)e.innerHTML=meta()},15000);
function home(){const nt=T.find(t=>!tdone(t.id)),nl=L.find(l=>!S.done[l.id]),p=pct();
const ms=[...new Set(L.map(l=>l.m))].map(m=>{const a=L.filter(l=>l.m===m),d=a.filter(l=>S.done[l.id]).length;return `<div style='margin:12px 0 0'><div class='row sp'><span>${m}</span><span class='mu'>${d}/${a.length} lições</span></div><div class='bar'><i style='width:${100*d/a.length}%'></i></div></div>`}).join('');
return `<h1>Escola Dev</h1><p class='mu'>Seu painel de estudo.</p><div class='card' id='meta'>${meta()}</div><div class='card'><div class='row sp'><b>Progresso geral</b><span class='pill'>${p}%</span></div><div class='bar' style='margin-top:10px'><i style='width:${p}%'></i></div>${ms}</div>`+(nl?`<div class='card'><span class='pill'>Próxima lição</span><h3>${esc(nl.t)}</h3><p class='mu'>${esc(nl.m)}, cerca de ${nl.min} min.</p><button class='btn s' data-a='open' data-i='${nl.id}'>Abrir lição</button></div>`:'')+(nt?`<div class='card'><span class='pill w'>Próxima tarefa</span><h3>${esc(nt.t)}</h3><p class='mu'>${esc(nt.d)}</p><button class='btn s' data-a='nav' data-i='tar'>Ver tarefas</button></div>`:'')}
let AQ='';
function alist(){const q=AQ.trim().toLowerCase();let h='',cur='';L.filter(l=>!q||(l.t+' '+l.b.replace(/<[^>]+>/g,' ')).toLowerCase().includes(q)).forEach(l=>{if(l.m!==cur){cur=l.m;const a=L.filter(x=>x.m===cur);h+=`<h2>${cur} <span class='mu'>(${a.filter(x=>S.done[x.id]).length}/${a.length})</span></h2>`}h+=`<button class='card item' data-a='open' data-i='${l.id}'><div class='row sp'><b>${l.t}</b><span class='pill ${S.done[l.id]?'o':''}'>${S.done[l.id]?'Concluída':l.min+' min'}</span></div></button>`});return h||'<p class="mu">Nada encontrado.</p>'}
function apo(){if(OP){const k=L.findIndex(x=>x.id===OP),l=L[k],pv=L[k-1],nx=L[k+1];return `<button class='btn g s' data-a='close'>Voltar à lista</button><h1 style='margin-top:14px'>${l.t}</h1><p class='mu'>${l.m}, lição ${k+1} de ${L.length}, cerca de ${l.min} min</p><div class='read'>${l.b}</div><div class='row' style='margin-top:16px'><button class='btn' data-a='done' data-i='${l.id}'>${S.done[l.id]?'Concluída (desfazer)':'Marcar como concluída'}</button></div><div class='row sp' style='margin-top:14px'>${pv?`<button class='btn g s' data-a='open' data-i='${pv.id}'>Anterior</button>`:'<span></span>'}${nx?`<button class='btn g s' data-a='open' data-i='${nx.id}'>Próxima</button>`:''}</div>`}
return `<h1>Apostila</h1><input id='aq' type='search' placeholder='Buscar nas lições' value='${esc(AQ)}' style='width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx)'><div id='al'>${alist()}</div>`}
function tar(){return `<h1>Tarefas</h1><p class='mu'>Avance o status, anote, e use “Copiar para o chat” para enviar a tarefa e receber a correção.</p>`+T.map(t=>{const s=S.tasks[t.id]||{s:0,n:''};return `<div class='card'><div class='row' style='flex-wrap:nowrap'><div class='chk'>${s.s>0?'✓':''}</div><b>${t.t}</b></div><p class='mu'>${t.d}</p><div class='row'><button class='btn s ${s.s?'':'g'}' data-a='task' data-i='${t.id}'>${ST[s.s]}</button><button class='btn s g' data-a='tcopy' data-i='${t.id}'>Copiar para o chat</button></div><textarea data-n='${t.id}' placeholder='O que você viu, sentiu ou não entendeu?'>${esc(s.n||'')}</textarea><p class='mu' id='c_${t.id}'></p></div>`}).join('')}
let FC=null;
function gls(){if(FC){const dk=G.filter(g=>((S.fc||{})[g[0]]||0)<3);if(!dk.length)return `<h1>Revisão</h1><div class='card'><p>Você dominou todos os termos. Muito bem.</p><button class='btn' data-a='fcend'>Voltar</button></div>`;const g=dk[FC.k%dk.length];return `<h1>Revisão</h1><p class='mu'>${dk.length} termos na fila. Acerte 3 vezes para um termo sair.</p><div class='card' style='min-height:140px'><b style='font-size:20px'>${g[0]}</b>${FC.s?`<p class='read'>${g[1]}</p>`:''}</div>`+(FC.s?`<div class='row'><button class='btn' data-a='fcok' data-i='${esc(g[0])}'>Acertei</button><button class='btn g' data-a='fcno' data-i='${esc(g[0])}'>Errei</button></div>`:`<button class='btn' data-a='fcshow'>Mostrar definição</button>`)+`<p><button class='btn g s' data-a='fcend'>Sair da revisão</button></p>`}
return `<h1>Termos</h1><p class='mu'>Dicionário fixo, com busca e cartões de revisão.</p><p><button class='btn s' data-a='fcstart'>Revisar com cartões</button></p><input id='gq' type='search' placeholder='Buscar termo' value='${esc(GQ)}' style='width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx)'><div id='gl'>${glist()}</div>`}
document.addEventListener('input',e=>{if(e.target.id==='aq'){AQ=e.target.value;document.getElementById('al').innerHTML=alist()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
if(a==='nav')FC=null;
else if(a==='goal'){S.goal=+i;save()}
else if(a==='fcstart')FC={k:0,s:false};
else if(a==='fcshow')FC.s=true;
else if(a==='fcok'){S.fc=S.fc||{};S.fc[i]=(S.fc[i]||0)+1;save();FC.s=false;FC.k++}
else if(a==='fcno'){S.fc=S.fc||{};S.fc[i]=0;save();FC.s=false;FC.k++}
else if(a==='fcend')FC=null;
else if(a==='tcopy'){const t=T.find(x=>x.id===i),s=S.tasks[i]||{s:0,n:''};const txt='Tarefa: '+t.t+'\nStatus: '+ST[s.s]+'\nMinhas anotações:\n'+(s.n||'(sem anotações)')+'\n\nPode revisar e me dizer o que entendi certo e o que preciso corrigir?';const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);let ok=false;try{ok=document.execCommand('copy')}catch(x){}ta.remove();const m=document.getElementById('c_'+i);if(m)m.textContent=ok?'Copiado. Cole no chat com o Claude.':'Não consegui copiar. Selecione suas anotações e copie manualmente.';return}
else return;
render()});
applyTheme();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
